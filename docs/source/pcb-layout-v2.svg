<text x="52" y="105" font-size="1.7" fill="#475569" text-anchor="start" font-family="system-ui,sans-serif">虚线框 = 底层元件；实线框 = 顶层元件；跨层叠放由底盘高度兜底（见文档 §5）。</text>
<text x="52" y="108.2" font-size="1.7" fill="#475569" text-anchor="start" font-family="system-ui,sans-serif">底层 = GND 铺铜 + 电源区辅助铜；顶层 = 信号 + 局部电源。电源主干：7V4≥2.0mm / 5V≥1.0mm / 3V3≥0.6mm。</text>
<text x="52" y="111.4" font-size="1.7" fill="#475569" text-anchor="start" font-family="system-ui,sans-serif">U8/U9 为壳上器件（OLED 屏幕朝上、VL53 前倾30°），经排线连板，不占板面。</text>
<text x="52" y="114.6" font-size="1.7" fill="#475569" text-anchor="start" font-family="system-ui,sans-serif">针脚圆 = 平躺直焊焊盘（2.54 等距）。测试点 TP1-TP6：TX/RX/3V3/5V/GND/ADC_BAT。</text>
